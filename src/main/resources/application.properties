# Default profile: points at the real OpenAI transcription API. Used as is on TITAN.
stt.api.url=https://api.openai.com/v1/audio/transcriptions
stt.api.key=${OPENAI_API_KEY:local-dev-placeholder}
server.shutdown=graceful
spring.application.name=stt
spring.threads.virtual.enabled=true
subtitles.api.url=https://api.openai.com/v1/audio/transcriptions
# Stop a dead network from hanging a request: give up connecting after 5 s and waiting for Whisper after 60 s.
# The player then sees a 500 and retries with backoff.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s
